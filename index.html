<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propriedade Digital - Work Drones Geo</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        .leaflet-control-gps {
            background: white;
            padding: 5px 10px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 1px 5px rgba(0,0,0,0.65);
            border-radius: 4px;
            text-decoration: none;
            color: #333;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .leaflet-control-gps:hover {
            background: #f4f4f4;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicializar o mapa centrado numa localização padrão (ex: Teresópolis / Região)
        const map = L.map('map').setView([-22.412, -42.965], 14);

        // Camada base do OpenStreetMap
        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Adicionar botão de GPS personalizado ao mapa
        const gpsControl = L.Control.extend({
            options: { position: 'topright' },
            onAdd: function (map) {
                const btn = L.DomUtil.create('a', 'leaflet-control-gps');
                btn.innerHTML = '📍 Localizar GPS';
                btn.href = '#';
                
                L.DomEvent.on(btn, 'click', function (e) {
                    L.DomEvent.stopPropagation(e);
                    L.DomEvent.preventDefault(e);
                    
                    map.locate({setView: true, maxZoom: 18, enableHighAccuracy: true});
                });
                return btn;
            }
        });
        map.addControl(new gpsControl());

        // Eventos de sucesso e erro do GPS
        map.on('locationfound', function(e) {
            const radius = e.accuracy / 2;
            L.marker(e.latlng).addTo(map)
                .bindPopup("Você está aqui (Precisão: " + radius.toFixed(0) + " metros)").openPopup();
            L.circle(e.latlng, radius).addTo(map);
        });

        map.on('locationerror', function(e) {
            alert("Não foi possível obter a sua localização: " + e.message);
        });
    </script>
</body>
</html>
